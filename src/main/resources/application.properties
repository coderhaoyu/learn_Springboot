spring.application.name=our_adventure

# 1. 数据库连接配置
# connectionTimeZone + forceConnectionTimeZoneToSession：建连接时让驱动执行 SET time_zone='Asia/Shanghai'。
# 不显式指定时，MySQL 会话时区跟随服务器（本地容器里是 UTC），于是 CURRENT_TIMESTAMP 生成
# created_at / updated_at 用 UTC，而 Java 侧 LocalDateTime.now() 用 JVM 时区（CST），
# 同一行里两拨时间会差 8 小时。这两项把「数据库时间基准」从隐式的部署环境变成显式的连接参数。
# 旧的 serverTimezone=UTC 是 connectionTimeZone 的已废弃别名，且与实际服务器时区矛盾，一并去掉。
# allowPublicKeyRetrieval=true：MySQL 8 的 root 用 caching_sha2_password，而这里是明文连接（useSSL=false），
# 服务端认证缓存为空时必须取一次公钥才能完成握手。缺这个参数，MySQL 每次重启后应用的第一个连接都会
# 报 "Public Key Retrieval is not allowed"。仅限本地开发使用。
spring.datasource.url=jdbc:p6spy:mysql://localhost:3306/our_adventure?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
# 2. MyBatis 映射文件配置（告诉 MyBatis XML 文件放在 resources/mapper/ 下）
mybatis.mapper-locations=classpath:mapper/*.xml

# 3. 开启下划线转驼峰自动映射（如：created_at -> createdAt）
mybatis.configuration.map-underscore-to-camel-case=true

# 4. MyBatis SQL 日志（控制台打印每次执行的 SQL 与绑定参数）
logging.level.com.example.ouradventure.mapper=debug

# 5. JWT 配置
app.jwt.secret=NJXLfbxfZYSs1+N2nPhxxXs++yTTD0WYTiFCoqx1qfar/OLA+mosr1VNvej2HfWx
app.jwt.expire-minutes=2880

server.servlet.context-path=/api