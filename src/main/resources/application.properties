spring.application.name=our_adventure

# 1. 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/our_adventure?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 2. MyBatis 映射文件配置（告诉 MyBatis XML 文件放在 resources/mapper/ 下）
mybatis.mapper-locations=classpath:mapper/*.xml

# 3. 开启下划线转驼峰自动映射（如：created_at -> createdAt）
mybatis.configuration.map-underscore-to-camel-case=true