# p6spy 配置 —— 用于在控制台看到带参数的完整 SQL
# 位置要求：必须放在 classpath 根目录，即 src/main/resources/spy.properties
# 生效条件：spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
#           spring.datasource.url 前缀为 jdbc:p6spy:

# 输出通道：交给 SLF4J，跟随 Spring Boot 的日志配置
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 输出格式：SQL 换行展示，便于阅读；复制时去掉末尾的统计信息即可
logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat

# 输出级别
logLevel=INFO
